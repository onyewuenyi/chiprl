[project]
name = "chiprl"
version = "0.1.0"
description = "RL environments and graders for RTL generation, verification, and power-aware PPA optimization"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Phase 2+: cocotb testbenches, typed tool schemas
dv = ["cocotb>=2.1"]
# Claude-in-the-loop: agent baseline, evals, best-of-N batches, hack auditor.
# GPU training deps live on the GPU service image, not on the Mac.
llm = ["anthropic>=2.8", "pydantic>=2.9"]
pd = [
    "librelane>=3.0.17",
]

[dependency-groups]
dev = ["pytest>=9.2", "pytest-xdist>=3.8", "ruff>=0.17", "ty>=0.0.101", "pre-commit>=4.7"]

[project.scripts]
chiprl-run = "chiprl.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chiprl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "PL"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLW0603", "RUF001", "PTH123", "E501", "SIM108", "PLR0917", "PLC0415", "PLR6301"]

[tool.ty.environment]
python-version = "3.12"
