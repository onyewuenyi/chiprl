[project]
name = "chiprl"
version = "0.1.0"
description = "RL environments and graders for RTL generation, verification, and power-aware PPA optimization"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Phase 2+: cocotb testbenches, typed tool schemas
dv = ["cocotb>=2.0"]
# Phase 3+: inference, tracking. GPU training deps live on the GPU service image, not on the Mac.
llm = ["openai>=1.0", "anthropic>=0.40", "wandb>=0.19"]

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3.6", "ruff>=0.8", "ty", "pre-commit>=4"]

[project.scripts]
chiprl-run = "chiprl.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chiprl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "PL"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLW0603", "RUF001", "PTH123", "E501", "SIM108", "PLR0917", "PLC0415", "PLR6301"]

[tool.ty.environment]
python-version = "3.12"
