name: claude
# Claude Code on GitHub: @claude in issues/PRs, plus an automatic review of PRs that touch the
# reward path (graders, tools, envs). Auth via Workload Identity Federation: no API key stored.
on:
  issue_comment: {types: [created]}
  pull_request_review_comment: {types: [created]}
  pull_request:
    types: [opened, synchronize]
    paths: ["chiprl/graders/**", "chiprl/tools/**", "chiprl/envs/**", "chiprl/rewards/**", "tests/test_golden.py"]
jobs:
  mention:
    if: >
      github.event_name != 'pull_request' &&
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-24.04
    permissions: {contents: write, pull-requests: write, issues: write, id-token: write, actions: read}
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 1}
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
  reward-path-review:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions: {contents: read, pull-requests: write, id-token: write}
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 1}
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          prompt: |
            REPO: ${{ github.repository }}  PR: ${{ github.event.pull_request.number }}
            This PR touches the reward path of an RL environment. Review it against AGENTS.md.
            Focus only on: (1) ways a policy could now pass without implementing the spec
            (reward hacking), (2) hidden testbench or reference leaking through a tool result,
            (3) infra errors that would be scored as 0 instead of None, (4) golden tests weakened,
            (5) cache keys that no longer reflect tool flags. Skip style. Post inline comments
            only for concrete issues, then one summary comment.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
