name: slow-path
# LibreLane (OpenROAD) post-route ground truth + OpenSTA VCD power on one fixture.
# Minutes per design, so nightly and on demand only.
on:
  schedule: [{cron: "17 7 * * *"}]
  workflow_dispatch:
jobs:
  pnr:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with: {version: "2026-11-12"}  # keep in sync with .oss-cad-suite-version
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked --extra pd
      - run: echo "$GITHUB_WORKSPACE/scripts/bin" >> "$GITHUB_PATH"
      - run: uv run librelane --dockerized --smoke-test
      - run: >
          uv run python -m chiprl.pipeline tests/fixtures/verilogeval/Prob068_countbcd
          --no-cache --pnr --power-backend auto --out pnr.json
      - uses: actions/upload-artifact@v7
        with: {name: pnr-json, path: pnr.json}
