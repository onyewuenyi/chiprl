name: ci
on:
  push: {branches: [main]}
  pull_request:
concurrency: {group: "${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: true}
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked --extra llm --extra pd
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run ty check
  golden:
    # Same toolchain as the Mac: OSS CAD Suite nightly. Grader golden tests + smoke pipeline.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: YosysHQ/setup-oss-cad-suite@v4
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked --extra llm
      - run: yosys -V && iverilog -V | head -1 && verilator --version && eqy --help | head -1
      - run: yosys -q -p 'plugin -i slang; help read_slang' | head -1  # yosys-slang present
      - run: uv run pytest -n auto
      - run: uv run python -m chiprl.pipeline tests/fixtures/verilogeval/Prob068_countbcd --no-cache --out smoke.json
      - uses: actions/upload-artifact@v7
        with: {name: smoke-json, path: smoke.json}
  golden-apt:
    # Older distro tools (yosys 0.33) to catch tool output-format drift across versions.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y yosys iverilog verilator
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run pytest -n auto
